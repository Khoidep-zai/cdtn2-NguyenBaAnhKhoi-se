server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:freelance_db}?sslmode=${DB_SSL_MODE:prefer}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:12345}
    hikari:
      pool-name: FreelanceHub-Postgres-Pool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:20000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:30000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:20000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:9a7f8e3b2c1d0f5e4a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  dev:
    auto-start-frontend: true

logging:
  level:
    com.nhom8.freelance: INFO
