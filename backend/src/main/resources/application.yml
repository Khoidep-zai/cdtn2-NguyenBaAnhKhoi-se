server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: freelance-platform-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:9a7f8e3b2c1d0f5e4a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours

# Swagger / OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
