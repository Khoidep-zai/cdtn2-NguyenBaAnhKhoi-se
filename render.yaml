# ========================================================
# Render Blueprint Specification for FreelanceHub Backend
# Multi-stage Docker Container on Render Cloud Platform
# ========================================================

services:
  - type: web
    name: freelance-platform-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/v1/jobs
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Connection to Neon Serverless PostgreSQL (Singapore Region)
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_7P1LtjvaYsyE@ep-crimson-morning-b32yo20b-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://ep-crimson-morning-b32yo20b-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require"
      - key: SPRING_DATASOURCE_USERNAME
        value: "neondb_owner"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "npg_7P1LtjvaYsyE"
      # High-entropy JWT Secret
      - key: JWT_SECRET
        value: "9a7f8e3b2c1d0f5e4a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f"
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # CORS configuration allowing Netlify frontend domains
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:3000,http://localhost:5173,http://localhost:8888,*"
      # HikariCP Serverless Connection Pool Tuning
      - key: HIKARI_MAX_POOL_SIZE
        value: 10
      - key: HIKARI_MIN_IDLE
        value: 2
      - key: HIKARI_IDLE_TIMEOUT
        value: 30000
      - key: HIKARI_CONN_TIMEOUT
        value: 20000
      - key: HIKARI_MAX_LIFETIME
        value: 600000
